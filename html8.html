<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
</head>

<body>

    <h1 align="center">Webpage Using Images, Hyperlinks and Iframes</h1>

    <hr>

    <h2>1. Image</h2>

    <img src="https://www.w3schools.com/html/img_girl.jpg"
         alt="Girl Image"
         width="300"
         height="300">

    <hr>

    <h2>2. Hyperlinks</h2>

    <a href="https://www.google.com" target="_blank">
        Click Here to Open Google
    </a>

    <br><br>

    <a href="https://www.youtube.com" target="_blank">
        Click Here to Open YouTube
    </a>

    <hr>

    <h2>3. Iframe</h2>

    <iframe
        src="page2.html"
        width="600"
        height="300"
        title="My Webpage">
    </iframe>

    <hr>

    <h3 align="center">Experiment 8 Completed</h3>

</body>
</html>
