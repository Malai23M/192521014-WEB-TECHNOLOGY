<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body bgcolor="lightblue">

<center>
    <h1><font color="darkblue">🎓 Student Registration Form</font></h1>
    <hr width="60%">
</center>

<form>

<table align="center" cellpadding="10">

<tr>
    <td><b>Student Name</b></td>
    <td><input type="text" placeholder="Enter your name"></td>
</tr>

<tr>
    <td><b>Roll Number</b></td>
    <td><input type="text" placeholder="Enter roll number"></td>
</tr>

<tr>
    <td><b>Password</b></td>
    <td><input type="password" placeholder="Enter password"></td>
</tr>

<tr>
    <td><b>Email</b></td>
    <td><input type="email" placeholder="Enter email"></td>
</tr>

<tr>
    <td><b>Gender</b></td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
    </td>
</tr>

<tr>
    <td><b>Languages Known</b></td>
    <td>
        <input type="checkbox"> Tamil
        <input type="checkbox"> English
        <input type="checkbox"> Hindi
    </td>
</tr>

<tr>
    <td><b>Department</b></td>
    <td>
        <select>
            <option>Select Department</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>
    </td>
</tr>

<tr>
    <td><b>Date of Birth</b></td>
    <td><input type="date"></td>
</tr>

<tr>
    <td><b>Mobile Number</b></td>
    <td><input type="tel" placeholder="Enter mobile number"></td>
</tr>

<tr>
    <td><b>Address</b></td>
    <td>
        <textarea rows="5" cols="30" placeholder="Enter your address"></textarea>
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
        &nbsp;&nbsp;
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>

<hr>

<center>
    <h3><font color="green">Thank You for Registering!</font></h3>
</center>

</body>
</html>
